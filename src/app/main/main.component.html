<button type="button" class="menu-toggle" (click)="toggleMenu()" aria-label="Menu">
  <i class="fa-solid" [class.fa-bars]="!isMenuOpen" [class.fa-xmark]="isMenuOpen"></i>
</button>

<div class="nav-backdrop" *ngIf="isMenuOpen" (click)="closeMenu()"></div>

<nav class="navbar" [class.open]="isMenuOpen">
  <a class="brand-card" routerLink="/" (click)="closeMenu()">
    <span class="brand-badge">TV</span>
    <span class="brand-meta">
      <span class="brand-title">Global TV</span>
      <span class="brand-sub">Budget Management</span>
    </span>
  </a>

  <div class="lang-card" role="group" aria-label="Language">
    <button
      type="button"
      class="lang-btn"
      [class.active]="langService.lang === 'en'"
      (click)="setLang('en')"
    >
      ENG
    </button>
    <button
      type="button"
      class="lang-btn"
      [class.active]="langService.lang === 'ka'"
      (click)="setLang('ka')"
    >
      GEO
    </button>
  </div>

  <ul class="nav-cards">
    @for (item of navItems; track item.path) {
    <li>
      <a
        class="nav-card"
        [routerLink]="item.requiresAccess ? null : item.path"
        routerLinkActive="active"
        (click)="onNavClick(item, $event)"
      >
        <span class="nav-card-icon">
          <i [class]="'fa-solid ' + item.icon"></i>
        </span>
        <span class="nav-card-text">{{ item.labelKey | t }}</span>
      </a>
    </li>
    }
  </ul>
</nav>

<div class="page-content">
  <router-outlet></router-outlet>
</div>

<div class="modal-backdrop" *ngIf="accessModal">
  <div class="modal-box access-modal">
    <div class="access-hero">
      <h2>{{ 'access.title' | t }}</h2>
      <button type="button" class="close-x" (click)="closeAccessModal()">✕</button>
    </div>
    <div class="access-body">
      <input
        type="password"
        [(ngModel)]="passwordInput"
        [placeholder]="'access.passwordPlaceholder' | t"
      />
      <div class="buttons">
        <button type="button" class="btn-cancel" (click)="closeAccessModal()">
          {{ 'access.cancel' | t }}
        </button>
        <button type="button" class="btn-enter" (click)="confirmAccess()">
          {{ 'access.enter' | t }}
        </button>
      </div>
    </div>
  </div>
</div>
