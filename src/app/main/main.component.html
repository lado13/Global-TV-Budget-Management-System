<!-- ☰ Burger button (მხოლოდ mobile-ზე გამოჩნდება) -->
<button class="menu-toggle" (click)="toggleMenu()">☰</button>

<nav class="navbar" [class.open]="isMenuOpen">
  <div class="nav-container">
    <div class="nav-logo" routerLink="/">
      <p>
        <span class="text-danger">📺 Global</span> TV
      </p>
    </div>

    <ul class="nav-links">
      @for (item of navItems; track item.path) {
      <li>
        <a
          class="link"
          [routerLink]="item.requiresAccess ? null : item.path"
          routerLinkActive="active"
          (click)="onNavClick(item, $event)"
        >
          {{ item.label }}
        </a>
      </li>
      }
    </ul>
  </div>
</nav>

<div class="page-content">
  <router-outlet></router-outlet>
</div>

<div class="modal-backdrop" *ngIf="accessModal">
  <div class="modal-box">
    <h2>🔐 Access Required</h2>
    <input type="password" [(ngModel)]="passwordInput" placeholder="შეიყვანე პაროლი" />
    <div class="buttons">
      <button (click)="closeAccessModal()">გაუქმება</button>
      <button (click)="confirmAccess()">შესვლა</button>
    </div>
  </div>
</div>
